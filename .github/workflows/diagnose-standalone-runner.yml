name: Diagnose standalone app process runner

on:
  push:
    branches:
      - feature/app-runtime-kernel
    paths:
      - ".github/workflows/diagnose-standalone-runner.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/app-runtime-kernel
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Extract patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-standalone-runner.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          block = source[start:end]
          Path('/tmp/patch.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in block) + '\n')
          PY
      - name: Apply and validate
        run: |
          mkdir -p .ci
          set +e
          python3 /tmp/patch.py > .ci/standalone-runner-report.txt 2>&1
          patch_status=$?
          echo "PATCH_STATUS=$patch_status" >> .ci/standalone-runner-report.txt
          if [ "$patch_status" -eq 0 ]; then
            deno task check >> .ci/standalone-runner-report.txt 2>&1
            echo "CHECK_STATUS=$?" >> .ci/standalone-runner-report.txt
            deno task test >> .ci/standalone-runner-report.txt 2>&1
            echo "TEST_STATUS=$?" >> .ci/standalone-runner-report.txt
            deno task build >> .ci/standalone-runner-report.txt 2>&1
            echo "BUILD_STATUS=$?" >> .ci/standalone-runner-report.txt
          fi
          cat .ci/standalone-runner-report.txt
          exit 0
      - name: Commit source or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server/app-builder.ts src/server.ts src/client/api.ts src/client/main.ts deno.lock .ci/standalone-runner-report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(kernel): apply or diagnose independent app runner (#7)"
          git push origin HEAD:feature/app-runtime-kernel
