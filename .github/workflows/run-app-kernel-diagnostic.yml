name: Diagnose app runtime kernel integration

on:
  push:
    branches:
      - feature/app-runtime-kernel
    paths:
      - ".github/workflows/run-app-kernel-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/app-runtime-kernel
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Extract integration patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-app-kernel.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          block = source[start:end]
          Path('/tmp/patch.py').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in block) + '\n')
          PY
      - name: Apply and validate
        run: |
          mkdir -p .ci
          set +e
          python3 /tmp/patch.py > .ci/app-kernel-report.txt 2>&1
          echo "PATCH_STATUS=$?" >> .ci/app-kernel-report.txt
          deno task check >> .ci/app-kernel-report.txt 2>&1
          echo "CHECK_STATUS=$?" >> .ci/app-kernel-report.txt
          deno task test >> .ci/app-kernel-report.txt 2>&1
          echo "TEST_STATUS=$?" >> .ci/app-kernel-report.txt
          deno task build >> .ci/app-kernel-report.txt 2>&1
          echo "BUILD_STATUS=$?" >> .ci/app-kernel-report.txt
          cat .ci/app-kernel-report.txt
          exit 0
      - name: Commit source and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/runtime.ts scripts/build.ts src/server.ts src/client/api.ts src/client/main.ts src/client/index.html src/client/styles.css deno.lock .ci/app-kernel-report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(kernel): apply iframe runtime integration with diagnostics (#7)"
          git push origin HEAD:feature/app-runtime-kernel
