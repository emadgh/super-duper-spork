              "version": 3, "id": "template", "name": "Calculator · Modular Demo",
              "objects": object_files,
              "objectFolders": ["UI", "Logic", "Logic/Input", "Logic/Operations", "Logic/Memory"],
              "instances": instances,
              "blackboard": {
                  "entry": {"type": "string", "value": "0"}, "display": {"type": "string", "value": "0"},
                  "left": {"type": "number", "value": 0}, "operator": {"type": "string", "value": ""},
                  "waiting": {"type": "boolean", "value": True}, "expression": {"type": "string", "value": ""},
                  "memory": {"type": "number", "value": 0},
              },
              "rules": rules, "updatedAt": "template",
          }
          write("templates/projects/calculator-modular/project.json", json.dumps(manifest, indent=2, ensure_ascii=False))

          # ----- Runtime regression: instance props are available to actions -----
          tests = Path("tests/runtime.test.ts")
          test_text = tests.read_text()
          if 'Deno.test("instance props are available to actions"' not in test_text:
              test_text += r'''

          Deno.test("instance props are available to actions", () => {
            const definitions = new Map<string, ObjectDefinition>([["Scale.ts", {
              name: "Scale",
              actions: {
                execute: {
                  inputs: { value: { type: "number" } },
                  outputs: { result: { type: "number" } },
                  run(context, inputs) {
                    return { result: Number(inputs.value ?? 0) * Number(context.props.factor ?? 1) };
                  },
                },
              },
            }]]);
            const runtime = new EventRuntime(
              definitions,
              [{ id: "scale1", objectFile: "Scale.ts", props: { factor: 4 } }],
              [{ id: "rule", event: { instanceId: "scale1", name: "go" }, actions: [{ id: "scale-step", action: { instanceId: "scale1", name: "execute" }, inputs: { value: { kind: "event", path: "value" } }, outputs: { result: { blackboardKey: "answer" } } }] }],
              { answer: { type: "number", value: 0 } },
            );
            runtime.emit("scale1", "go", { value: 3 });
            assertEquals(runtime.getBlackboard().answer.value, 12);
          });
          '''
              tests.write_text(test_text)

          # ----- CI: all feature branches + downloadable build/source artifacts -----
          ci = Path(".github/workflows/ci.yml")
          ci_text = ci.read_text()
          ci_text = ci_text.replace('      - feature/studio-v0.3', '      - "feature/**"')
          if 'name: Package distributable' not in ci_text:
              ci_text = ci_text.replace(
                  '      - name: Build\n        run: deno task build\n',
                  '''      - name: Build
                run: deno task build
              - name: Package distributable
                run: |
                  rm -rf artifacts package
                  mkdir -p artifacts package/src
                  cp -R dist package/dist
                  cp -R templates package/templates
                  cp src/server.ts package/src/server.ts
                  cp deno.json run.bat VERSION README.md package/
                  (cd package && zip -qr ../artifacts/super-duper-spork-studio-build.zip .)
                  git archive --format=zip --output=artifacts/super-duper-spork-studio-source.zip HEAD
              - uses: actions/upload-artifact@v4
                with:
                  name: studio-v0.4-artifacts
                  path: artifacts/*.zip
          '''.replace('              ', '      ', 1),
                  1,
              )
          ci.write_text(ci_text)

          # Correct the CI block indentation deterministically.
          ci.write_text('''name: Studio CI

          on:
            push:
              branches:
                - main
                - "feature/**"
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            check-test-build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v5
                - uses: denoland/setup-deno@v2
                  with:
                    deno-version: v2.x
                - name: Type check
                  run: deno task check
                - name: Runtime tests
                  run: deno task test
                - name: Build
                  run: deno task build
                - name: Package distributable
                  run: |
                    rm -rf artifacts package
                    mkdir -p artifacts package/src
                    cp -R dist package/dist
                    cp -R templates package/templates
                    cp src/server.ts package/src/server.ts
                    cp deno.json run.bat VERSION README.md package/
                    (cd package && zip -qr ../artifacts/super-duper-spork-studio-build.zip .)
                    git archive --format=zip --output=artifacts/super-duper-spork-studio-source.zip HEAD
                - uses: actions/upload-artifact@v4
                  with:
                    name: studio-v0.4-artifacts
                    path: artifacts/*.zip
          '''.replace('          ', ''))

          Path("VERSION").write_text("0.4.0\n")
          changelog = Path("CHANGELOG.md")
          old = changelog.read_text()
          if "## 0.4.0" not in old:
              changelog.write_text('''# Changelog

          ## 0.4.0 - Modular components and ready actions

          - Added parent/child UI composition with named slots.
          - Added per-instance props so one reusable component file can back many configured component instances.
          - Rebuilt the calculator example as a modular project template instead of a two-file UI/engine God Component pair.
          - Every calculator key is an independent component instance of `UI/CalculatorKey.ts`.
          - Add, Subtract, Multiply, and Divide are independent command files; input, clear, backspace, and memory commands are split as well.
          - Added an Action Library with ready Math, Number, Text, Logic, and State actions.
          - Ready actions can be inserted from the Objects panel with the lightning button.
          - CI now validates all feature branches and publishes build/source artifacts.

          '''.replace('          ', '') + old.split('\n', 1)[1])

          readme = Path("README.md")
          readme_text = readme.read_text()
          if "## Modular building blocks" not in readme_text:
              readme.write_text(readme_text + '''

          ## Modular building blocks

          Projects can compose visual objects instead of growing one large UI object. A parent mount may return named `slots`; child instances select a parent instance and slot, and reusable component files receive per-instance `props`. The modular calculator demonstrates this with one reusable key component instantiated for every key and separate command files for arithmetic, editing, and memory behavior.

          The Objects panel also includes an **Action Library** (⚡) for inserting ready-made typed actions such as Add, Divide, Clamp, Round, Concat, Equals, and Set Value.
          '''.replace('          ', ''))

          # Remove the one-shot workflow from the resulting source tree.
          Path(".github/workflows/apply-modular-v04.yml").unlink()
          PY

      - name: Validate type check
        run: deno task check
      - name: Validate tests
        run: deno task test
      - name: Validate build
        run: deno task build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: modular components and reusable action library (#2)"
          git push origin HEAD:feature/modular-components-actions
