name: Apply modular v0.4 architecture

on:
  push:
    branches:
      - feature/modular-components-actions
    paths:
      - ".github/workflows/apply-modular-v04.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/modular-components-actions
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply architecture refactor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          def write(path: str, content: str):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content.strip() + "\n")

          # ----- Client model: instance props + component composition -----
          replace_once(
              "src/client/model.ts",
              "export interface ActionContext<State extends Record<string, unknown> = Record<string, unknown>> {\n  state: State;\n  payload: unknown;\n  emit: (eventName: string, payload?: unknown) => void;\n}",
              "export interface ActionContext<State extends Record<string, unknown> = Record<string, unknown>> {\n  state: State;\n  props: Readonly<Record<string, unknown>>;\n  payload: unknown;\n  emit: (eventName: string, payload?: unknown) => void;\n}",
          )
          replace_once(
              "src/client/model.ts",
              "export interface MountContext<State extends Record<string, unknown> = Record<string, unknown>> {\n  host: HTMLElement;\n  state: State;\n  emit: (eventName: string, payload?: unknown) => void;\n}",
              "export interface MountContext<State extends Record<string, unknown> = Record<string, unknown>> {\n  host: HTMLElement;\n  state: State;\n  props: Readonly<Record<string, unknown>>;\n  emit: (eventName: string, payload?: unknown) => void;\n}",
          )
          replace_once(
              "src/client/model.ts",
              "export interface MountedObject {\n  update?: () => void;\n  dispose?: () => void;\n}",
              "export interface MountedObject {\n  update?: () => void;\n  dispose?: () => void;\n  /** Named DOM mount points that can host child component instances. */\n  slots?: Record<string, HTMLElement>;\n}",
          )
          replace_once(
              "src/client/model.ts",
              "export interface ProjectInstance {\n  id: string;\n  objectFile: string;\n}",
              "export interface ProjectInstance {\n  id: string;\n  objectFile: string;\n  /** Per-instance configuration. A reusable component file can therefore back many component instances. */\n  props?: Record<string, unknown>;\n  /** Optional visual parent. Child components mount into a named slot exposed by the parent. */\n  parent?: {\n    instanceId: string;\n    slot: string;\n  };\n}",
          )
          replace_once(
              "src/client/model.ts",
              "export interface ProjectSummary {\n  id: string;\n  name: string;\n  updatedAt: string;\n}\n",
              "export interface ProjectSummary {\n  id: string;\n  name: string;\n  updatedAt: string;\n}\n\nexport interface ActionTemplateSummary {\n  id: string;\n  name: string;\n  category: string;\n  description: string;\n  defaultFile: string;\n}\n",
          )

          # ----- Runtime: roots + slots + child component instances -----
          write("src/client/runtime.ts", r'''
          import type {
            ActionStep,
            BlackboardEntry,
            EventRule,
            MountedObject,
            ObjectDefinition,
            ProjectInstance,
            ValueBinding,
          } from "./model.ts";

          interface RuntimeInstance {
            id: string;
            definition: ObjectDefinition;
            state: Record<string, unknown>;
            props: Readonly<Record<string, unknown>>;
            mount?: MountedObject;
          }

          export interface RuntimeTrace {
            kind: "event" | "action" | "error";
            label: string;
            detail?: string;
          }

          interface RuntimeOptions {
            onTrace?: (trace: RuntimeTrace) => void;
            onBlackboardChange?: (blackboard: Record<string, BlackboardEntry>) => void;
          }

          export class EventRuntime {
            readonly #definitionsByFile: Map<string, ObjectDefinition>;
            readonly #instances: ProjectInstance[];
            readonly #rules: EventRule[];
            readonly #runtimeInstances = new Map<string, RuntimeInstance>();
            readonly #blackboard: Record<string, BlackboardEntry>;
            readonly #options: RuntimeOptions;

            constructor(
              definitionsByFile: Map<string, ObjectDefinition>,
              instances: ProjectInstance[],
              rules: EventRule[],
              blackboard: Record<string, BlackboardEntry>,
              options: RuntimeOptions = {},
            ) {
              this.#definitionsByFile = definitionsByFile;
              this.#instances = instances;
              this.#rules = rules;
              this.#blackboard = structuredClone(blackboard);
              this.#options = options;

              for (const instance of instances) {
                const definition = definitionsByFile.get(instance.objectFile);
                if (!definition) continue;
                this.#runtimeInstances.set(instance.id, {
                  id: instance.id,
                  definition,
                  state: cloneState(definition.state ?? {}),
                  props: Object.freeze(structuredClone(instance.props ?? {})),
                });
              }
            }

            mountPreview(root: HTMLElement): void {
              root.replaceChildren();
              const mounted = new Set<string>();

              const mountInstance = (instance: ProjectInstance, target: HTMLElement, embedded: boolean): void => {
                if (mounted.has(instance.id)) return;
                const runtimeInstance = this.#runtimeInstances.get(instance.id);
                if (!runtimeInstance || !runtimeInstance.definition.mount) return;
                mounted.add(instance.id);

                let host: HTMLElement;
                if (embedded) {
                  host = document.createElement("div");
                  host.className = "preview-component";
                  host.dataset.instanceId = instance.id;
                  target.append(host);
                } else {
                  const card = document.createElement("section");
                  card.className = "preview-object";
                  card.dataset.instanceId = instance.id;

                  const header = document.createElement("div");
                  header.className = "preview-object__title";
                  header.innerHTML = `<span>${escapeHtml(runtimeInstance.definition.name)}</span><code>${escapeHtml(instance.id)}</code>`;

                  host = document.createElement("div");
                  host.className = "preview-object__host";
                  card.append(header, host);
                  target.append(card);
                }

                const mountedObject = runtimeInstance.definition.mount({
                  host,
                  state: runtimeInstance.state,
                  props: runtimeInstance.props,
                  emit: (eventName, payload) => this.emit(instance.id, eventName, payload),
                });
                runtimeInstance.mount = mountedObject || undefined;

                const children = this.#instances.filter((candidate) => candidate.parent?.instanceId === instance.id);
                for (const child of children) {
                  const slotName = child.parent?.slot ?? "";
                  const slot = runtimeInstance.mount?.slots?.[slotName];
                  if (!slot) {
                    this.#trace("error", `${child.id}.mount`, `Parent ${instance.id} does not expose slot ${slotName || "<empty>"}`);
                    continue;
                  }
                  mountInstance(child, slot, true);
                }
              };

              for (const instance of this.#instances.filter((item) => !item.parent)) mountInstance(instance, root, false);

              // Invalid/missing parents should not make a visual component disappear silently.
              for (const instance of this.#instances) {
                if (mounted.has(instance.id)) continue;
                const runtimeInstance = this.#runtimeInstances.get(instance.id);
                if (!runtimeInstance?.definition.mount) continue;
                this.#trace("error", `${instance.id}.mount`, "Component parent could not be resolved; mounted as a root object.");
                mountInstance({ ...instance, parent: undefined }, root, false);
              }
            }

            emit(instanceId: string, eventName: string, payload?: unknown): void {
              this.#trace("event", `${instanceId}.${eventName}`);
              const matching = this.#rules.filter(
                (rule) => rule.event.instanceId === instanceId && rule.event.name === eventName,
              );

              for (const rule of matching) {
                const outputs = new Map<string, Record<string, unknown>>();
                for (const step of rule.actions) {
                  try {
                    const result = this.#runAction(step, payload, outputs);
                    outputs.set(step.id, result);
                  } catch (error) {
                    this.#trace("error", `${step.action.instanceId}.${step.action.name}`, errorMessage(error));
                    console.error(error);
                  }
                }
              }
            }

            dispose(): void {
              for (const instance of this.#runtimeInstances.values()) instance.mount?.dispose?.();
              this.#runtimeInstances.clear();
            }

            getState(instanceId: string): Record<string, unknown> | undefined {
              return this.#runtimeInstances.get(instanceId)?.state;
            }

            getBlackboard(): Record<string, BlackboardEntry> {
              return structuredClone(this.#blackboard);
            }

            #runAction(
              step: ActionStep,
              eventPayload: unknown,
              previousOutputs: Map<string, Record<string, unknown>>,
            ): Record<string, unknown> {
              const target = this.#runtimeInstances.get(step.action.instanceId);
              if (!target) throw new Error(`Unknown instance: ${step.action.instanceId}`);

              const action = target.definition.actions?.[step.action.name];
              if (!action) throw new Error(`Unknown action: ${step.action.instanceId}.${step.action.name}`);

              const inputs: Record<string, unknown> = {};
              for (const [name, port] of Object.entries(action.inputs ?? {})) {
                const binding = step.inputs[name];
                inputs[name] = binding ? this.#resolveBinding(binding, eventPayload, previousOutputs) : port.default;
              }

              this.#trace("action", `${step.action.instanceId}.${step.action.name}`, formatInputs(inputs));
              const result = action.run(
                {
                  state: target.state,
                  props: target.props,
                  payload: eventPayload,
                  emit: (nextEventName, nextPayload) => this.emit(target.id, nextEventName, nextPayload),
                },
                inputs,
              ) ?? {};

              target.mount?.update?.();

              for (const [outputName, mapping] of Object.entries(step.outputs)) {
                if (!mapping.blackboardKey || !(outputName in result)) continue;
                const entry = this.#blackboard[mapping.blackboardKey];
                if (!entry) continue;
                entry.value = result[outputName];
                this.#options.onBlackboardChange?.(this.getBlackboard());
              }

              return result;
            }

            #resolveBinding(
              binding: ValueBinding,
              eventPayload: unknown,
              previousOutputs: Map<string, Record<string, unknown>>,
            ): unknown {
              switch (binding.kind) {
                case "literal": return binding.value;
                case "blackboard": return this.#blackboard[binding.key]?.value;
                case "state": return getPath(this.#runtimeInstances.get(binding.instanceId)?.state, binding.path);
                case "event": return getPath(eventPayload, binding.path);
                case "output": return previousOutputs.get(binding.stepId)?.[binding.name];
              }
            }

            #trace(kind: RuntimeTrace["kind"], label: string, detail?: string): void {
              this.#options.onTrace?.({ kind, label, detail });
            }
          }

          function getPath(source: unknown, path: string): unknown {
            if (!path) return source;
            let value = source;
            for (const part of path.split(".").filter(Boolean)) {
              if (!value || typeof value !== "object") return undefined;
              value = (value as Record<string, unknown>)[part];
            }
            return value;
          }

          function cloneState(source: Record<string, unknown>): Record<string, unknown> {
            return structuredClone(source);
          }

          function formatInputs(inputs: Record<string, unknown>): string | undefined {
            const entries = Object.entries(inputs);
            if (!entries.length) return undefined;
            return entries.map(([key, value]) => `${key}=${String(value)}`).join(", ");
          }

          function errorMessage(error: unknown): string {
            return error instanceof Error ? error.message : String(error);
          }

          function escapeHtml(value: string): string {
            return value.replace(/[&<>'\"]/g, (char) => ({
              "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '\"': "&quot;",
            }[char] ?? char));
          }
          ''')

          # ----- Client API: ready-action catalog -----
          write("src/client/api.ts", r'''
          import type { ActionTemplateSummary, LoadedProject, ProjectManifest, ProjectSummary } from "./model.ts";

          async function request<T>(url: string, init?: RequestInit): Promise<T> {
            const response = await fetch(url, {
              ...init,
              headers: { "content-type": "application/json", ...(init?.headers ?? {}) },
            });
            if (!response.ok) {
              const body = await response.json().catch(() => ({ error: response.statusText }));
              throw new Error((body as { error?: string }).error || response.statusText);
            }
            return await response.json() as T;
          }

          export const api = {
            listProjects(): Promise<ProjectSummary[]> { return request<ProjectSummary[]>("/api/projects"); },
            listActionTemplates(): Promise<ActionTemplateSummary[]> { return request<ActionTemplateSummary[]>("/api/action-library"); },
            loadProject(projectId: string): Promise<LoadedProject> { return request<LoadedProject>(`/api/projects/${encodeURIComponent(projectId)}`); },
            createProject(name: string): Promise<LoadedProject> {
              return request<LoadedProject>("/api/projects", { method: "POST", body: JSON.stringify({ name }) });
            },
            addObject(projectId: string, name: string, folder = ""): Promise<LoadedProject> {
              return request<LoadedProject>(`/api/projects/${encodeURIComponent(projectId)}/objects`, {
                method: "POST", body: JSON.stringify({ name, folder }),
              });
            },
            addActionTemplate(projectId: string, templateId: string, folder = ""): Promise<LoadedProject> {
              return request<LoadedProject>(`/api/projects/${encodeURIComponent(projectId)}/action-library`, {
                method: "POST", body: JSON.stringify({ templateId, folder }),
              });
            },
            addObjectFolder(projectId: string, name: string, parent = ""): Promise<LoadedProject> {
              return request<LoadedProject>(`/api/projects/${encodeURIComponent(projectId)}/folders`, {
                method: "POST", body: JSON.stringify({ name, parent }),
              });
            },
            moveObject(projectId: string, file: string, folder: string): Promise<LoadedProject> {
              return request<LoadedProject>(`/api/projects/${encodeURIComponent(projectId)}/objects/${encodeURIComponent(file)}/move`, {
                method: "POST", body: JSON.stringify({ folder }),
              });
            },
            revealProject(projectId: string): Promise<{ ok: true }> {
              return request<{ ok: true }>(`/api/projects/${encodeURIComponent(projectId)}/reveal`, { method: "POST", body: JSON.stringify({}) });
            },
            revealObject(projectId: string, file: string): Promise<{ ok: true }> {
              return request<{ ok: true }>(`/api/projects/${encodeURIComponent(projectId)}/reveal`, {
                method: "POST", body: JSON.stringify({ objectFile: file }),
              });
            },
            saveObject(projectId: string, file: string, source: string): Promise<LoadedProject> {
              return request<LoadedProject>(`/api/projects/${encodeURIComponent(projectId)}/objects/${encodeURIComponent(file)}`, {
                method: "PUT", body: JSON.stringify({ source }),
              });
            },
            saveManifest(projectId: string, manifest: ProjectManifest): Promise<LoadedProject> {
              return request<LoadedProject>(`/api/projects/${encodeURIComponent(projectId)}`, {
                method: "PUT", body: JSON.stringify({ manifest }),
              });
            },
          };
          ''')

          # ----- Studio UI: ready-action button and dialog -----
          replace_once(
              "src/client/index.html",
              '<div class="section-actions">\n            <button id="add-folder" class="icon-button" title="New object folder">▱</button>\n            <button id="add-object" class="icon-button" title="New object">＋</button>\n          </div>',
              '<div class="section-actions">\n            <button id="add-library-action" class="icon-button" title="Add ready action">⚡</button>\n            <button id="add-folder" class="icon-button" title="New object folder">▱</button>\n            <button id="add-object" class="icon-button" title="New object">＋</button>\n          </div>',
          )
          replace_once(
              "src/client/index.html",
              '  <dialog id="project-manager" class="project-dialog">',
              '''  <dialog id="action-library-dialog" class="project-dialog">
    <div class="project-dialog-shell">
      <div class="project-dialog-head">
        <div>
          <span class="eyebrow">READY ACTIONS</span>
          <h2>Action Library</h2>
          <p>Add a small, reusable action object to the selected object folder. No boilerplate required.</p>
        </div>
        <button id="close-action-library" class="icon-button" aria-label="Close action library">×</button>
      </div>
      <div id="action-library-grid" class="project-grid"></div>
    </div>
  </dialog>

  <dialog id="project-manager" class="project-dialog">''',
          )

          main = Path("src/client/main.ts")
          text = main.read_text()
          text = text.replace("  ActionStep,\n  BlackboardEntry,", "  ActionStep,\n  ActionTemplateSummary,\n  BlackboardEntry,", 1)
          text = text.replace(
              'const addObjectButton = required<HTMLButtonElement>("#add-object");\nconst addFolderButton = required<HTMLButtonElement>("#add-folder");',
              'const addObjectButton = required<HTMLButtonElement>("#add-object");\nconst addLibraryActionButton = required<HTMLButtonElement>("#add-library-action");\nconst addFolderButton = required<HTMLButtonElement>("#add-folder");',
              1,
          )
          text = text.replace(
              'const projectGrid = required<HTMLElement>("#project-grid");',
              'const projectGrid = required<HTMLElement>("#project-grid");\nconst actionLibraryDialog = required<HTMLDialogElement>("#action-library-dialog");\nconst closeActionLibraryButton = required<HTMLButtonElement>("#close-action-library");\nconst actionLibraryGrid = required<HTMLElement>("#action-library-grid");',
              1,
          )
          text = text.replace(
              'let projectSummaries: ProjectSummary[] = [];',
              'let projectSummaries: ProjectSummary[] = [];\nlet actionTemplates: ActionTemplateSummary[] | null = null;',
              1,
          )
          text = text.replace(
              'addObjectButton.addEventListener("click", () => void addObject());\naddFolderButton.addEventListener("click", () => void addObjectFolder());',
              '''addObjectButton.addEventListener("click", () => void addObject());
          addLibraryActionButton.addEventListener("click", () => void openActionLibrary());
          closeActionLibraryButton.addEventListener("click", () => actionLibraryDialog.close());
          actionLibraryDialog.addEventListener("click", (event) => {
            if (event.target === actionLibraryDialog) actionLibraryDialog.close();
          });
          addFolderButton.addEventListener("click", () => void addObjectFolder());''',
              1,
          )
          marker = 'async function addObject(): Promise<void> {'
          if marker not in text:
              raise SystemExit("main addObject marker missing")
          action_ui = r'''
          async function openActionLibrary(): Promise<void> {
            if (!project) return;
            try {
              actionTemplates ??= await api.listActionTemplates();
              renderActionLibrary();
              actionLibraryDialog.showModal();
            } catch (error) {
              setGlobalStatus(errorMessage(error), true);
            }
          }

          function renderActionLibrary(): void {
            actionLibraryGrid.replaceChildren();
            for (const template of actionTemplates ?? []) {
              const card = document.createElement("article");
              card.className = "project-card";
              card.innerHTML = `
                <span class="project-card-icon">⚡</span>
                <span class="project-card-copy">
                  <strong>${escapeHtml(template.name)}</strong>
                  <small>${escapeHtml(template.description)}</small>
                  <em>${escapeHtml(template.category)} · ${escapeHtml(template.defaultFile)}</em>
                </span>
                <span class="project-card-actions"></span>
              `;
              const actions = card.querySelector<HTMLElement>(".project-card-actions");
              const add = document.createElement("button");
              add.className = "project-card-open";
              add.textContent = "Add →";
              add.addEventListener("click", () => void addReadyAction(template));
              actions?.append(add);
              actionLibraryGrid.append(card);
            }
            if (!actionLibraryGrid.children.length) actionLibraryGrid.append(emptyMessage("No ready actions are installed."));
          }

          async function addReadyAction(template: ActionTemplateSummary): Promise<void> {
            if (!project) return;
            try {
              const updated = await api.addActionTemplate(project.manifest.id, template.id, selectedFolder);
              project = updated;
              definitions = compileDefinitions(updated.objects);
              selectedFile = updated.manifest.objects.at(-1) ?? null;
              if (selectedFile) selectedFolder = objectParentFolder(selectedFile);
              dirty = false;
              actionLibraryDialog.close();
              renderAll();
              setGlobalStatus(`${template.name} added`);
            } catch (error) {
              setGlobalStatus(errorMessage(error), true);
            }
          }

          '''
          text = text.replace(marker, action_ui + marker, 1)
          main.write_text(text)

          # ----- Server: preserve props/parent, template projects, ready-action endpoint -----
          replace_once(
              "src/server.ts",
              'interface ProjectInstance {\n  id: string;\n  objectFile: string;\n}',
              'interface ProjectInstance {\n  id: string;\n  objectFile: string;\n  props?: Record<string, unknown>;\n  parent?: { instanceId: string; slot: string };\n}',
          )
          replace_once(
              "src/server.ts",
              'const PROJECTS_DIR = new URL("workspace/projects/", ROOT);',
              'const PROJECTS_DIR = new URL("workspace/projects/", ROOT);\nconst TEMPLATES_DIR = new URL("templates/", ROOT);',
          )
          replace_once(
              "src/server.ts",
              '  const parts = url.pathname.split("/").filter(Boolean).map(decodeURIComponent);\n\n  if (parts.length === 2 && parts[0] === "api" && parts[1] === "projects") {',
              '''  const parts = url.pathname.split("/").filter(Boolean).map(decodeURIComponent);

  if (parts.length === 2 && parts[0] === "api" && parts[1] === "action-library" && request.method === "GET") {
    return json(listReadyActionTemplates());
  }

  if (parts.length === 2 && parts[0] === "api" && parts[1] === "projects") {''',
          )
          replace_once(
              "src/server.ts",
              '    if (parts.length === 4 && parts[3] === "reveal" && request.method === "POST") {',
              '''    if (parts.length === 4 && parts[3] === "action-library" && request.method === "POST") {
      const body = await readJson<{ templateId?: string; folder?: string }>(request);
      const templateId = body.templateId?.trim();
      if (!templateId) return json({ error: "Action template id is required." }, 400);
      await addReadyAction(projectId, templateId, body.folder ?? "");
      return json(await loadProject(projectId), 201);
    }

    if (parts.length === 4 && parts[3] === "reveal" && request.method === "POST") {''',
          )
          replace_once(
              "src/server.ts",
              '  await ensureRealCalculatorDemo();',
              '  await ensureProjectTemplate("calculator-modular-demo", "Calculator · Modular Demo", "calculator-modular");',
          )
          replace_once(
              "src/server.ts",
              '    instances: Array.isArray(manifest.instances)\n      ? manifest.instances.filter(isInstance).map((item) => ({ id: item.id, objectFile: validateObjectPath(item.objectFile) }))\n      : [],',
              '    instances: Array.isArray(manifest.instances)\n      ? manifest.instances.filter(isInstance).map(sanitizeProjectInstance)\n      : [],',
          )
          replace_once(
              "src/server.ts",
              'function isInstance(value: unknown): value is ProjectInstance {',
              '''function sanitizeProjectInstance(item: ProjectInstance): ProjectInstance {
  const props = item.props && typeof item.props === "object" && !Array.isArray(item.props)
    ? structuredClone(item.props)
    : undefined;
  const parent = item.parent && typeof item.parent === "object" &&
      typeof item.parent.instanceId === "string" && typeof item.parent.slot === "string"
    ? { instanceId: item.parent.instanceId, slot: item.parent.slot }
    : undefined;
  return {
    id: item.id,
    objectFile: validateObjectPath(item.objectFile),
    ...(props ? { props } : {}),
    ...(parent ? { parent } : {}),
  };
}

function isInstance(value: unknown): value is ProjectInstance {''',
          )

          server = Path("src/server.ts")
          server_text = server.read_text()
          marker = 'async function projectExists(projectId: string): Promise<boolean> {'
          if marker not in server_text:
              raise SystemExit("server projectExists marker missing")
          server_helpers = r'''
          interface ReadyActionTemplate {
            id: string;
            name: string;
            category: string;
            description: string;
            defaultFile: string;
            templatePath: string;
          }

          const READY_ACTION_TEMPLATES: ReadyActionTemplate[] = [
            { id: "math.add", name: "Add", category: "Math", description: "Add two numbers.", defaultFile: "Add.ts", templatePath: "actions/math/Add.ts" },
            { id: "math.subtract", name: "Subtract", category: "Math", description: "Subtract right from left.", defaultFile: "Subtract.ts", templatePath: "actions/math/Subtract.ts" },
            { id: "math.multiply", name: "Multiply", category: "Math", description: "Multiply two numbers.", defaultFile: "Multiply.ts", templatePath: "actions/math/Multiply.ts" },
            { id: "math.divide", name: "Divide", category: "Math", description: "Divide left by right with zero protection.", defaultFile: "Divide.ts", templatePath: "actions/math/Divide.ts" },
            { id: "math.modulo", name: "Modulo", category: "Math", description: "Return the division remainder.", defaultFile: "Modulo.ts", templatePath: "actions/math/Modulo.ts" },
            { id: "number.clamp", name: "Clamp", category: "Number", description: "Clamp a number between minimum and maximum.", defaultFile: "Clamp.ts", templatePath: "actions/number/Clamp.ts" },
            { id: "number.round", name: "Round", category: "Number", description: "Round a number to a chosen number of decimals.", defaultFile: "Round.ts", templatePath: "actions/number/Round.ts" },
            { id: "text.concat", name: "Concat Text", category: "Text", description: "Join two text values.", defaultFile: "Concat.ts", templatePath: "actions/text/Concat.ts" },
