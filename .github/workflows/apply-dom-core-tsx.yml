name: Apply DOM Core TSX server patch

on:
  push:
    branches:
      - feature/dom-core-tsx
    paths:
      - ".github/workflows/apply-dom-core-tsx.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/dom-core-tsx
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Patch server TSX compilation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          text = p.read_text()

          old = '''    compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.CommonJS,
                strict: true,
                esModuleInterop: false,
              },'''
          new = '''    compilerOptions: {
                target: ts.ScriptTarget.ES2022,
                module: ts.ModuleKind.CommonJS,
                strict: true,
                esModuleInterop: false,
                jsx: ts.JsxEmit.React,
                jsxFactory: "h",
                jsxFragmentFactory: "Fragment",
              },'''
          if old not in text:
              raise SystemExit('transpileObject compilerOptions block not found')
          text = text.replace(old, new, 1)

          old_regex = 'if (!/^[A-Za-z][A-Za-z0-9_-]{0,79}\\.ts$/.test(file)) throw new Error("Invalid object filename.");'
          new_regex = 'if (!/^[A-Za-z][A-Za-z0-9_-]{0,79}\\.tsx?$/.test(file)) throw new Error("Invalid object filename.");'
          if old_regex not in text:
              raise SystemExit('object path extension regex not found')
          text = text.replace(old_regex, new_regex, 1)

          p.write_text(text)
          PY
      - name: Type check
        run: deno task check
      - name: Tests
        run: deno task test
      - name: Build
        run: deno task build
      - name: Commit server integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts
          git commit -m "feat(dom): accept TSX object files in server compiler (#4)"
          git push origin HEAD:feature/dom-core-tsx
