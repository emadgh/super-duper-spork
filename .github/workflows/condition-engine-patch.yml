name: Condition Engine Patch

on:
  push:
    branches:
      - feature/condition-engine
    paths:
      - .github/workflows/condition-engine-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/condition-engine
          fetch-depth: 0
      - name: Apply condition engine patch
        run: python3 scripts/patch-condition-engine.py
      - name: Commit patch and remove one-shot files
        shell: bash
        run: |
          rm .github/workflows/condition-engine-patch.yml scripts/patch-condition-engine.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "Wire conditions into editor, persistence, and diagram"
          git push origin HEAD:feature/condition-engine
