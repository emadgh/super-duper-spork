name: Apply project package manager integration

on:
  push:
    branches:
      - feature/project-package-manager
    paths:
      - ".github/workflows/apply-package-manager.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/project-package-manager
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Patch server integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/server.ts')
          s = p.read_text()

          def one(old, new, label):
              global s
              if old not in s:
                  raise RuntimeError(f'missing anchor: {label}')
              s = s.replace(old, new, 1)

          one(
              'import { defaultStyleCompiler } from "./server/style-pipeline.ts";\n',
              'import { defaultStyleCompiler } from "./server/style-pipeline.ts";\nimport { packagePresetSummaries, ProjectPackageManager, sanitizePackageManifest } from "./server/package-manager.ts";\n',
              'package manager import',
          )

          one(
              '  if (parts.length === 2 && parts[0] === "api" && parts[1] === "action-library" && request.method === "GET") {\n    return json(listReadyActionTemplates());\n  }\n',
              '  if (parts.length === 2 && parts[0] === "api" && parts[1] === "action-library" && request.method === "GET") {\n    return json(listReadyActionTemplates());\n  }\n\n  if (parts.length === 2 && parts[0] === "api" && parts[1] === "package-library" && request.method === "GET") {\n    return json(packagePresetSummaries());\n  }\n',
              'package library route',
          )

          marker = '    if (parts.length === 4 && parts[3] === "action-library" && request.method === "POST") {'
          package_routes = '''    if (parts.length === 5 && parts[3] === "packages" && parts[4] === "presets" && request.method === "POST") {
      const body = await readJson<{ presetId?: string }>(request);
      const presetId = body.presetId?.trim();
      if (!presetId) return json({ error: "Package preset id is required." }, 400);
      const manager = new ProjectPackageManager(projectUrl(projectId));
      await manager.addPreset(presetId);
      return json(await loadProject(projectId));
    }

    if (parts.length === 5 && parts[3] === "packages" && parts[4] === "install" && request.method === "POST") {
      const manager = new ProjectPackageManager(projectUrl(projectId));
      const result = await manager.install();
      const manifest = await manager.read();
      return json({
        packages: { manifest, effectivePermissions: manager.effectivePermissions(manifest) },
        output: result.output,
      });
    }

    if (parts.length === 5 && parts[3] === "packages" && request.method === "DELETE") {
      const manager = new ProjectPackageManager(projectUrl(projectId));
      await manager.remove(parts[4]);
      return json(await loadProject(projectId));
    }

'''
          one(marker, package_routes + marker, 'project package routes')

          # New projects always own an explicit packages.json + generated deno.json.
          create_anchor = '  await writeManifest(manifest);\n  return manifest;\n}\n\nasync function addObject'
          one(
              create_anchor,
              '  await writeManifest(manifest);\n  await new ProjectPackageManager(dir).ensure();\n  return manifest;\n}\n\nasync function addObject',
              'new project package manifest',
          )

          # Template projects may provide packages.json; otherwise receive an empty one.
          template_start = s.index('async function ensureProjectTemplate')
          template_end = s.index('async function projectExists', template_start)
          section = s[template_start:template_end]
          anchor = '  await writeManifest(manifest);\n}\n\n'
          if anchor not in section:
              raise RuntimeError('template package anchor missing')
          block = '''  await writeManifest(manifest);
  const packageManager = new ProjectPackageManager(projectUrl(projectId));
  try {
    const rawPackages = JSON.parse(await Deno.readTextFile(new URL("packages.json", templateRoot)));
    await packageManager.write(sanitizePackageManifest(rawPackages));
  } catch (error) {
    if (!(error instanceof Deno.errors.NotFound)) throw error;
    await packageManager.ensure();
  }
}

'''
          section = section.replace(anchor, block, 1)
          s = s[:template_start] + section + s[template_end:]

          # Loaded project includes package state without coupling it to project.json.
          pattern = re.compile(r'async function loadProject\(projectId: string\): Promise<\{.*?\n\}\n\nfunction transpileObject', re.S)
          m = pattern.search(s)
          if not m:
              raise RuntimeError('loadProject not found')
          old = m.group(0)
          # Only augment the existing working function; retain style/object logic.
          body = old.replace(
              '  styles: Array<{ file: string; source: string; compiled: string; warnings: string[] }>;\n}> {',
              '  styles: Array<{ file: string; source: string; compiled: string; warnings: string[] }>;\n  packages: { manifest: ReturnType<typeof sanitizePackageManifest>; effectivePermissions: ReturnType<ProjectPackageManager["effectivePermissions"]> };\n}> {',
              1,
          )
          body = body.replace(
              '  return { manifest, objects, styles };\n}',
              '  const packageManager = new ProjectPackageManager(projectUrl(projectId));\n  const packageManifest = await packageManager.read();\n  return {\n    manifest,\n    objects,\n    styles,\n    packages: { manifest: packageManifest, effectivePermissions: packageManager.effectivePermissions(packageManifest) },\n  };\n}',
              1,
          )
          if body == old:
              raise RuntimeError('loadProject augmentation failed')
          s = s[:m.start()] + body + s[m.end():]

          p.write_text(s)
          PY
      - name: Validate
        run: |
          deno task check
          deno task test
          deno task build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts deno.lock
          git commit -m "feat(packages): integrate project package APIs and sidecars (#6)"
          git push origin HEAD:feature/project-package-manager
