name: Run package manager integration

on:
  push:
    branches:
      - feature/project-package-manager
    paths:
      - ".github/workflows/run-package-manager-integration.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/project-package-manager
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Extract server patcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-package-manager.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          block = source[start:end]
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in block)
          Path('/tmp/package_patch.py').write_text(normalized + '\n')
          PY
      - name: Apply server integration
        run: python3 /tmp/package_patch.py
      - name: Validate
        run: |
          deno task check
          deno task test
          deno task build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts src/server/package-manager.ts deno.lock
          git commit -m "feat(packages): integrate project package APIs and sidecars (#6)"
          git push origin HEAD:feature/project-package-manager
