name: Apply v0.3 CI fixes

on:
  push:
    branches:
      - feature/studio-v0.3
    paths:
      - ".github/workflows/fix-v03-ci.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/studio-v0.3
      - name: Apply fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path("src/server.ts")
          text = server.read_text()
          old_cast = 'const manifest = JSON.parse(source) as Partial<ProjectManifest> & { version?: number; objectFolders?: unknown };'
          new_cast = 'const manifest = JSON.parse(source) as Omit<Partial<ProjectManifest>, "version" | "objectFolders"> & { version?: number; objectFolders?: unknown };'
          old_sig = 'function sanitizeLoadedManifest(manifest: Partial<ProjectManifest> & { id?: string; version?: number; objectFolders?: unknown }): ProjectManifest {'
          new_sig = 'function sanitizeLoadedManifest(manifest: Omit<Partial<ProjectManifest>, "version" | "objectFolders"> & { id?: string; version?: number; objectFolders?: unknown }): ProjectManifest {'
          if old_cast not in text or old_sig not in text:
              raise SystemExit("Expected server manifest code not found")
          server.write_text(text.replace(old_cast, new_cast).replace(old_sig, new_sig))

          test = Path("tests/runtime.test.ts")
          test_text = test.read_text()
          directive = '/// <reference lib="dom" />\n'
          if not test_text.startswith(directive):
              test.write_text(directive + test_text)
          PY

          rm -f ci-typecheck.txt

          cat > .github/workflows/ci.yml <<'YAML'
          name: Studio CI

          on:
            push:
              branches:
                - main
                - feature/studio-v0.3
            pull_request:
              branches:
                - main

          permissions:
            contents: read

          jobs:
            check-test-build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v5
                - uses: denoland/setup-deno@v2
                  with:
                    deno-version: v2.x
                - name: Type check
                  run: deno task check
                - name: Runtime tests
                  run: deno task test
                - name: Build
                  run: deno task build
          YAML

          rm -f .github/workflows/fix-v03-ci.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: pass Deno type checking"
          git push origin HEAD:feature/studio-v0.3
