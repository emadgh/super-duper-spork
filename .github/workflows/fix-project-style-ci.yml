name: Fix project style CI

on:
  push:
    branches:
      - feature/project-style-pipeline
    paths:
      - ".github/workflows/fix-project-style-ci.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/project-style-pipeline
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Add missing style list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          text = p.read_text()
          old = '    objectFolders: ["UI", "Logic"],\n    instances:'
          new = '    objectFolders: ["UI", "Logic"],\n    styles: [],\n    instances:'
          if old not in text:
              raise SystemExit('real calculator manifest anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Validate
        run: |
          deno task check
          deno task test
          deno task build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts deno.lock
          git commit -m "fix(styles): complete legacy manifest style defaults (#5)"
          git push origin HEAD:feature/project-style-pipeline
