name: Run modular v0.4 patch

on:
  push:
    branches:
      - feature/modular-components-actions
    paths:
      - ".github/workflows/run-modular-v04.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/modular-components-actions
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Extract patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-modular-v04.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          block = source[start:end]
          normalized = '\n'.join(line[10:] if line.startswith('          ') else line for line in block)
          Path('/tmp/apply-modular.py').write_text(normalized + '\n')
          PY
      - name: Apply refactor
        run: python3 /tmp/apply-modular.py
      - name: Remove one-shot workflows
        run: rm -f .github/workflows/apply-modular-v04.yml .github/workflows/run-modular-v04.yml
      - name: Validate type check
        run: deno task check
      - name: Validate tests
        run: deno task test
      - name: Validate build
        run: deno task build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: modular components and reusable action library (#2)"
          git push origin HEAD:feature/modular-components-actions
