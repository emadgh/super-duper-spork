name: Apply project stylesheet integration v2

on:
  push:
    branches:
      - feature/project-style-pipeline
    paths:
      - ".github/workflows/apply-project-styles-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/project-style-pipeline
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply source integration
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path
          import re

          p = Path("src/server.ts")
          s = p.read_text()

          def one(old, new, name):
              global s
              if old not in s:
                  raise RuntimeError(f"missing anchor: {name}")
              s = s.replace(old, new, 1)

          one(
              'import ts from "npm:typescript@5.9.2";\n',
              'import ts from "npm:typescript@5.9.2";\nimport { defaultStyleCompiler } from "./server/style-pipeline.ts";\n',
              "import",
          )
          one(
              '  objectFolders: string[];\n  instances: ProjectInstance[];',
              '  objectFolders: string[];\n  styles: string[];\n  instances: ProjectInstance[];',
              "manifest styles",
          )

          # API routes.
          marker = '    if (parts.length === 4 && parts[3] === "folders" && request.method === "POST") {'
          one(marker, '''    if (parts.length === 4 && parts[3] === "styles" && request.method === "POST") {
      const body = await readJson<{ name?: string }>(request);
      const name = body.name?.trim();
      if (!name) return json({ error: "Style name is required." }, 400);
      await addStyle(projectId, name);
      return json(await loadProject(projectId), 201);
    }

''' + marker, "style create route")

          marker = '    if (parts.length === 4 && parts[3] === "reveal" && request.method === "POST") {'
          one(marker, '''    if (parts.length === 5 && parts[3] === "styles" && request.method === "PUT") {
      const file = validateStylePath(parts[4]);
      const body = await readJson<{ source?: string }>(request);
      if (typeof body.source !== "string") return json({ error: "Style source is required." }, 400);
      const manifest = await readManifest(projectId);
      if (!manifest.styles.includes(file)) return json({ error: "Unknown style file." }, 404);
      defaultStyleCompiler.compile(body.source, file);
      await Deno.writeTextFile(styleUrl(projectId, file), body.source);
      manifest.updatedAt = new Date().toISOString();
      await writeManifest(manifest);
      return json(await loadProject(projectId));
    }

''' + marker, "style save route")

          # All built-in manifest literals currently use this pair.
          s = s.replace('    objectFolders: [],\n    instances:', '    objectFolders: [],\n    styles: [],\n    instances:')

          # Template metadata and style copying.
          one(
              '    objectFolders: normalizeFolders(raw.objectFolders ?? [], raw.objects),\n    instances: raw.instances.filter(isInstance).map(sanitizeProjectInstance),',
              '    objectFolders: normalizeFolders(raw.objectFolders ?? [], raw.objects),\n    styles: Array.isArray(raw.styles) ? raw.styles.map(validateStylePath) : [],\n    instances: raw.instances.filter(isInstance).map(sanitizeProjectInstance),',
              "template styles metadata",
          )
          one(
              '  await Deno.mkdir(new URL("objects/", projectUrl(projectId)), { recursive: true });\n  for (const file of manifest.objects) {',
              '  await Deno.mkdir(new URL("objects/", projectUrl(projectId)), { recursive: true });\n  await Deno.mkdir(new URL("styles/", projectUrl(projectId)), { recursive: true });\n  for (const file of manifest.objects) {',
              "template style dir",
          )
          template_start = s.index('async function ensureProjectTemplate')
          template_end = s.index('async function projectExists', template_start)
          section = s[template_start:template_end]
          end_anchor = '  await writeManifest(manifest);\n}\n\n'
          if end_anchor not in section:
              raise RuntimeError("missing template write anchor")
          section = section.replace(end_anchor, '''  for (const file of manifest.styles) {
    const source = await Deno.readTextFile(new URL(`styles/${file}`, templateRoot));
    const compiled = defaultStyleCompiler.compile(source, file);
    if (compiled.warnings.length) console.warn(`Style ${file}: ${compiled.warnings.join("; ")}`);
    const target = styleUrl(projectId, file);
    await Deno.mkdir(new URL(".", target), { recursive: true });
    await Deno.writeTextFile(target, source);
  }
  await writeManifest(manifest);
}

''', 1)
          s = s[:template_start] + section + s[template_end:]

          # New project storage.
          one(
              '  await Deno.mkdir(new URL("objects/", dir), { recursive: true });\n\n  const manifest:',
              '  await Deno.mkdir(new URL("objects/", dir), { recursive: true });\n  await Deno.mkdir(new URL("styles/", dir), { recursive: true });\n\n  const manifest:',
              "new project style dir",
          )

          # Style object-management primitive.
          marker = 'async function addObjectFolder(projectId: string, rawName: string, rawParent = ""): Promise<void> {'
          one(marker, '''async function addStyle(projectId: string, rawName: string): Promise<void> {
  const manifest = await readManifest(projectId);
  const base = slugify(rawName) || "styles";
  let file = validateStylePath(`${base}.css`);
  let index = 2;
  while (manifest.styles.includes(file)) file = validateStylePath(`${base}-${index++}.css`);
  const className = base.replace(/[^A-Za-z0-9_-]/g, "-");
  const source = `@layer project {\n  .${className} {\n    /* Project styles */\n  }\n}\n`;
  defaultStyleCompiler.compile(source, file);
  await Deno.mkdir(new URL("styles/", projectUrl(projectId)), { recursive: true });
  await Deno.writeTextFile(styleUrl(projectId, file), source);
  manifest.styles.push(file);
  manifest.updatedAt = new Date().toISOString();
  await writeManifest(manifest);
}

''' + marker, "addStyle")

          # Replace loadProject in one bounded range.
          pattern = re.compile(r'async function loadProject\(projectId: string\): Promise<\{.*?\n\}\n\nfunction transpileObject', re.S)
          match = pattern.search(s)
          if not match:
              raise RuntimeError("loadProject range not found")
          replacement = '''async function loadProject(projectId: string): Promise<{
  manifest: ProjectManifest;
  objects: Array<{ file: string; source: string; compiled: string }>;
  styles: Array<{ file: string; source: string; compiled: string; warnings: string[] }>;
}> {
  const manifest = await readManifest(projectId);
  const objects = [];
  const styles = [];
  for (const file of manifest.objects) {
    const source = await Deno.readTextFile(objectUrl(projectId, file));
    const result = transpileObject(source, file);
    objects.push({ file, source, compiled: result.output });
  }
  for (const file of manifest.styles) {
    const source = await Deno.readTextFile(styleUrl(projectId, file));
    const result = defaultStyleCompiler.compile(source, file);
    styles.push({ file, source, compiled: result.css, warnings: result.warnings });
  }
  return { manifest, objects, styles };
}

function transpileObject'''
          s = s[:match.start()] + replacement + s[match.end():]

          # Backward-compatible v2/v3 manifests.
          one(
              '    objectFolders: normalizeFolders(explicitFolders, objects),\n    instances:',
              '    objectFolders: normalizeFolders(explicitFolders, objects),\n    styles: Array.isArray(manifest.styles) ? manifest.styles.filter((value): value is string => typeof value === "string").map(validateStylePath) : [],\n    instances:',
              "manifest migration",
          )
          one(
              '    objectFolders: normalizeFolders(current.objectFolders, current.objects),\n    instances: current.instances,',
              '    objectFolders: normalizeFolders(current.objectFolders, current.objects),\n    styles: current.styles,\n    instances: current.instances,',
              "manifest save",
          )

          # Project path helpers.
          marker = 'function objectFolderUrl(projectId: string, folder: string): URL {'
          one(marker, '''function styleUrl(projectId: string, file: string): URL {
  return new URL(`styles/${encodeObjectPath(validateStylePath(file))}`, projectUrl(projectId));
}

''' + marker, "style url")
          marker = 'function validateObjectFolder(value: string): string {'
          one(marker, r'''function validateStylePath(value: string): string {
  const normalized = value.replace(/\\/g, "/").replace(/^\/+|\/+$/g, "");
  const segments = normalized.split("/");
  if (!segments.length || segments.length > 8) throw new Error("Invalid style path.");
  const file = segments.at(-1) ?? "";
  if (!/^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}\.css$/i.test(file)) throw new Error("Invalid style filename.");
  for (const folder of segments.slice(0, -1)) validateFolderSegment(folder);
  return segments.join("/");
}

''' + marker, "style validator")
          p.write_text(s)

          # Project CSS is preview-level input; DomCore itself remains style-provider agnostic.
          p = Path("src/client/runtime.ts")
          s = p.read_text()
          old = '  mountPreview(root: HTMLElement): void {\n    root.replaceChildren();\n    const mounted = new Set<string>();'
          if old not in s:
              raise RuntimeError("runtime mountPreview anchor missing")
          new = '''  mountPreview(root: HTMLElement, options: { styles?: readonly string[] } = {}): void {
    root.replaceChildren();
    const appRoot = document.createElement("div");
    appRoot.className = "spork-app";
    if (options.styles?.length) {
      const style = document.createElement("style");
      style.dataset.sporkProjectStyles = "";
      style.textContent = options.styles.join("\\n");
      root.append(style);
    }
    root.append(appRoot);
    const mounted = new Set<string>();'''
          s = s.replace(old, new, 1)
          s = s.replace('mountInstance(instance, root, false);', 'mountInstance(instance, appRoot, false);')
          s = s.replace('mountInstance({ ...instance, parent: undefined }, root, false);', 'mountInstance({ ...instance, parent: undefined }, appRoot, false);')
          p.write_text(s)

          p = Path("src/client/main.ts")
          s = p.read_text()
          old = '  runtime.mountPreview(previewHost);'
          if old not in s:
              raise RuntimeError("main preview anchor missing")
          p.write_text(s.replace(old, '  runtime.mountPreview(previewHost, { styles: project.styles.map((style) => style.compiled) });', 1))
          PY
          python3 /tmp/patch.py

      - name: Validate
        run: |
          deno task check
          deno task test
          deno task build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts src/client/runtime.ts src/client/main.ts deno.lock
          git commit -m "feat(styles): integrate project-owned CSS assets (#5)"
          git push origin HEAD:feature/project-style-pipeline
