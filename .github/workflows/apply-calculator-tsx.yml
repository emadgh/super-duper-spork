name: Apply calculator TSX manifest migration

on:
  push:
    branches:
      - feature/calculator-tsx-css
    paths:
      - ".github/workflows/apply-calculator-tsx.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/calculator-tsx-css
      - name: Update calculator template manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('templates/projects/calculator-modular/project.json')
          data = json.loads(path.read_text())
          replacements = {
              'UI/CalculatorShell.ts': 'UI/CalculatorShell.tsx',
              'UI/CalculatorDisplay.ts': 'UI/CalculatorDisplay.tsx',
              'UI/CalculatorKey.ts': 'UI/CalculatorKey.tsx',
          }
          data['objects'] = [replacements.get(item, item) for item in data.get('objects', [])]
          data['styles'] = ['calculator.css']
          for instance in data.get('instances', []):
              instance['objectFile'] = replacements.get(instance.get('objectFile'), instance.get('objectFile'))
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Commit manifest migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/projects/calculator-modular/project.json
          git commit -m "feat(calculator): wire TSX components and project CSS (#8)"
          git push origin HEAD:feature/calculator-tsx-css
