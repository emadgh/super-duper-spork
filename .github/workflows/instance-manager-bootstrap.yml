name: Instance Manager Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/instance-manager
          fetch-depth: 0
      - name: Apply controlled integration patch
        run: python3 scripts/patch-instance-manager.py
      - name: Commit integration and remove one-shot helpers
        shell: bash
        run: |
          rm .github/workflows/instance-manager-bootstrap.yml scripts/patch-instance-manager.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No integration changes to commit."
            exit 0
          fi
          git commit -m "Add Instance Manager UI and manifest lifecycle"
          git push origin HEAD:feature/instance-manager
