name: Expression Bootstrap Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  patch-expression-branch:
    if: github.event.issue.number == 19 && contains(github.event.comment.body, '/run-expression-bootstrap')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/expression-engine
          fetch-depth: 0
      - name: Apply expression integration
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/patch-expression-integration.py
          python3 - <<'PY'
          from pathlib import Path

          expression = Path('src/client/expression.ts')
          source = expression.read_text(encoding='utf-8')
          unreachable = '''    case "&&":
    case "||":
    case "??": throw new Error(`Internal expression evaluator error for ${node.operator}.`);
'''
          if unreachable not in source:
              raise SystemExit('expression evaluator logical cases not found')
          expression.write_text(source.replace(unreachable, '', 1), encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          workflow = ci.read_text(encoding='utf-8')
          begin = '      # BEGIN EXPRESSION BOOTSTRAP\n'
          end_marker = '      # END EXPRESSION BOOTSTRAP\n'
          if begin in workflow:
              start = workflow.index(begin)
              end = workflow.index(end_marker, start) + len(end_marker)
              workflow = workflow[:start] + workflow[end:]
          workflow = workflow.replace('permissions:\n  contents: write\n', 'permissions:\n  contents: read\n', 1)
          ci.write_text(workflow, encoding='utf-8')
          PY
          rm -f .github/workflows/expression-integration-patch.yml scripts/patch-expression-integration.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Complete expression editor runtime and persistence integration"
          git push origin HEAD:feature/expression-engine
