name: Studio CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno task check
      - name: Runtime tests
        run: deno task test
      - name: Build
        run: deno task build
      - name: Package distributable
        run: |
          rm -rf artifacts package
          mkdir -p artifacts package/src
          cp -R dist package/dist
          cp -R templates package/templates
          cp src/server.ts package/src/server.ts
          cp deno.json run.bat VERSION README.md package/
          (cd package && zip -qr ../artifacts/super-duper-spork-studio-build.zip .)
          git archive --format=zip --output=artifacts/super-duper-spork-studio-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: studio-v0.4-artifacts
          path: artifacts/*.zip
