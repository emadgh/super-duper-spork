name: Apply Phone Book bootstrap

on:
  push:
    branches:
      - feature/phone-book-reference
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/phone-book-reference
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply integration
        run: python3 scripts/apply_phonebook_integration.py
      - name: Validate integration
        run: |
          deno task check
          deno task test
          deno task build
      - name: Commit implementation and restore normal CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f \
            .github/workflows/apply-phone-book-integration.yml \
            .github/workflows/run-phone-book-integration.yml \
            .ci/phonebook-bootstrap-trigger.txt \
            scripts/apply_phonebook_integration.py
          git add -A
          git commit -m "feat(phonebook): integrate lifecycle template and build providers (#9)"
          git push origin HEAD:feature/phone-book-reference
