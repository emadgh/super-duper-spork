name: Build diagnostic

on:
  push:
    branches:
      - feature/studio-v0.3
    paths:
      - ".github/workflows/build-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Capture build
        run: |
          set +e
          deno task build > build-diagnostic.txt 2>&1
          code=$?
          cat build-diagnostic.txt
          echo "$code" > build-exit-code.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: build-diagnostic
          path: |
            build-diagnostic.txt
            build-exit-code.txt
