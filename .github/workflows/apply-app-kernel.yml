name: Apply app runtime kernel integration

on:
  push:
    branches:
      - feature/app-runtime-kernel
    paths:
      - ".github/workflows/apply-app-kernel.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/app-runtime-kernel
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Patch runtime, server and Studio runner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, label, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise RuntimeError(f'missing {label} in {path}')
              p.write_text(s.replace(old, new, count))

          # Runtime: application mode renders root components without Studio cards.
          replace(
              'src/client/runtime.ts',
              '  mountPreview(root: HTMLElement, options: { styles?: readonly string[] } = {}): void {',
              '  mountPreview(root: HTMLElement, options: { styles?: readonly string[]; chrome?: boolean } = {}): void {',
              'runtime options',
          )
          old = '''      } else {
        const card = document.createElement("section");
        card.className = "preview-object";
        card.dataset.instanceId = instance.id;

        const header = document.createElement("div");
        header.className = "preview-object__title";
        header.innerHTML = `<span>${escapeHtml(runtimeInstance.definition.name)}</span><code>${escapeHtml(instance.id)}</code>`;

        host = document.createElement("div");
        host.className = "preview-object__host";
        card.append(header, host);
        target.append(card);
      }'''
          new = '''      } else if (options.chrome !== false) {
        const card = document.createElement("section");
        card.className = "preview-object";
        card.dataset.instanceId = instance.id;

        const header = document.createElement("div");
        header.className = "preview-object__title";
        header.innerHTML = `<span>${escapeHtml(runtimeInstance.definition.name)}</span><code>${escapeHtml(instance.id)}</code>`;

        host = document.createElement("div");
        host.className = "preview-object__host";
        card.append(header, host);
        target.append(card);
      } else {
        host = document.createElement("div");
        host.className = "preview-component preview-component--root";
        host.dataset.instanceId = instance.id;
        target.append(host);
      }'''
          replace('src/client/runtime.ts', old, new, 'runtime chrome')

          # Build Studio client plus browser App Kernel for dist mode.
          p = Path('scripts/build.ts')
          s = p.read_text()
          s = s.replace('const CLIENT_DIST = new URL("client/", DIST);', 'const CLIENT_DIST = new URL("client/", DIST);\nconst APP_KERNEL_SOURCE = new URL("src/app-kernel/", ROOT);\nconst APP_KERNEL_DIST = new URL("app-kernel/", DIST);', 1)
          s = s.replace('await compileDirectory(SOURCE, CLIENT_DIST);', 'await compileDirectory(SOURCE, CLIENT_DIST);\nawait compileKernelDirectory(APP_KERNEL_SOURCE, APP_KERNEL_DIST);', 1)
          marker = 'async function compileDirectory(sourceDir: URL, outputDir: URL): Promise<void> {'
          kernel_fn = '''async function compileKernelDirectory(sourceDir: URL, outputDir: URL): Promise<void> {
  await Deno.mkdir(outputDir, { recursive: true });
  for (const name of ["browser.ts", "bridge.ts"]) {
    const sourceUrl = new URL(name, sourceDir);
    const source = await Deno.readTextFile(sourceUrl);
    const output = ts.transpileModule(source, {
      fileName: name,
      compilerOptions: {
        target: ts.ScriptTarget.ES2022,
        module: ts.ModuleKind.ES2022,
        strict: true,
        rewriteRelativeImportExtensions: true,
        sourceMap: false,
      },
    }).outputText;
    await Deno.writeTextFile(new URL(name.replace(/\\.ts$/, ".js"), outputDir), output);
  }
}

'''
          if marker not in s: raise RuntimeError('build marker missing')
          s = s.replace(marker, kernel_fn + marker, 1)
          p.write_text(s)

          # Server: App Kernel preview endpoint and standalone build API.
          p = Path('src/server.ts')
          s = p.read_text()
          s = s.replace('import { packagePresetSummaries, ProjectPackageManager, sanitizePackageManifest } from "./server/package-manager.ts";\n', 'import { packagePresetSummaries, ProjectPackageManager, sanitizePackageManifest } from "./server/package-manager.ts";\nimport { buildStandaloneApp } from "./server/app-builder.ts";\n', 1)
          s = s.replace('const TEMPLATES_DIR = new URL("templates/", ROOT);', 'const TEMPLATES_DIR = new URL("templates/", ROOT);\nconst BUILDS_DIR = new URL("workspace/builds/", ROOT);', 1)
          s = s.replace('      if (url.pathname.startsWith("/api/")) {\n        return await handleApi(request, url);\n      }\n\n      return await serveApp(url.pathname);', '      if (url.pathname.startsWith("/api/")) {\n        return await handleApi(request, url);\n      }\n      if (url.pathname.startsWith("/apps/")) {\n        return await serveProjectApp(url.pathname);\n      }\n\n      return await serveApp(url.pathname);', 1)

          marker = '    if (parts.length === 4 && parts[3] === "objects" && request.method === "POST") {'
          build_route = '''    if (parts.length === 4 && parts[3] === "build" && request.method === "POST") {
      const project = await loadProject(projectId);
      const outputRoot = new URL(`${projectId}/`, BUILDS_DIR);
      const result = await buildStandaloneApp({ projectId, projectRoot: projectUrl(projectId), outputRoot, project });
      return json({ ok: true, projectId, output: decodeURIComponent(result.outputRoot.pathname) });
    }

'''
          if marker not in s: raise RuntimeError('server build route marker missing')
          s = s.replace(marker, build_route + marker, 1)

          serve_marker = 'async function serveApp(pathname: string): Promise<Response> {'
          app_serve = r'''async function serveProjectApp(pathname: string): Promise<Response> {
  const parts = pathname.split("/").filter(Boolean).map(decodeURIComponent);
  if (parts.length < 2 || parts[0] !== "apps") return new Response("Not found", { status: 404 });
  const projectId = validateProjectId(parts[1]);
  if (parts.length === 3 && parts[2] === "app-data.json") {
    const response = json(await loadProject(projectId));
    response.headers.set("access-control-allow-origin", "*");
    return response;
  }
  if (parts.length === 2) return projectAppHtml(projectId);
  return new Response("Not found", { status: 404 });
}

function projectAppHtml(projectId: string): Response {
  const id = JSON.stringify(projectId);
  const dataUrl = JSON.stringify(`/apps/${encodeURIComponent(projectId)}/app-data.json`);
  const html = `<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spork App</title>
<style>html,body,#spork-app-root{min-height:100%;margin:0}body{background:#11141b;color:#f5f7fb}</style></head>
<body><div id="spork-app-root"></div>
<script>window.__SPORK_APP__={projectId:${id},dataUrl:${dataUrl}};<\/script>
<script type="module" src="/app-kernel/browser.js"><\/script></body></html>`;
  return new Response(html, { headers: { "content-type": "text/html; charset=utf-8", "cache-control": "no-store" } });
}

'''
          if serve_marker not in s: raise RuntimeError('serveApp marker missing')
          s = s.replace(serve_marker, app_serve + serve_marker, 1)

          # Dist and dev App Kernel modules; JS gets CORS because sandboxed iframe has opaque origin.
          dist_marker = '    if (pathname.startsWith("/client/") && pathname.endsWith(".js")) {'
          dist_kernel = '''    if (pathname.startsWith("/app-kernel/") && pathname.endsWith(".js")) {
      const relative = pathname.replace(/^\\/app-kernel\\//, "");
      const response = await fileResponse(new URL(`dist/app-kernel/${relative}`, ROOT), "text/javascript; charset=utf-8");
      response.headers.set("access-control-allow-origin", "*");
      return response;
    }
'''
          if dist_marker not in s: raise RuntimeError('dist client marker missing')
          s = s.replace(dist_marker, dist_kernel + dist_marker, 1)

          dev_marker = '  if (pathname.startsWith("/client/") && pathname.endsWith(".js")) {'
          dev_kernel = '''  if (pathname.startsWith("/app-kernel/") && pathname.endsWith(".js")) {
    const relative = pathname.slice("/app-kernel/".length).replace(/\\.js$/, ".ts");
    if (!/^[a-zA-Z0-9_.-]+\\.ts$/.test(relative)) return new Response("Invalid path", { status: 400 });
    const source = await Deno.readTextFile(new URL(`src/app-kernel/${relative}`, ROOT));
    const result = ts.transpileModule(source, {
      fileName: relative,
      compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ES2022, strict: true, rewriteRelativeImportExtensions: true },
    });
    return new Response(result.outputText, { headers: { "content-type": "text/javascript; charset=utf-8", "cache-control": "no-store", "access-control-allow-origin": "*" } });
  }

'''
          # choose second occurrence by replacing last-compatible dev marker
          idx = s.rfind(dev_marker)
          if idx < 0: raise RuntimeError('dev client marker missing')
          s = s[:idx] + dev_kernel + s[idx:]

          # Add CORS to both dev and dist client module responses for opaque sandbox module imports.
          s = s.replace('headers: { "content-type": "text/javascript; charset=utf-8", "cache-control": "no-store" },', 'headers: { "content-type": "text/javascript; charset=utf-8", "cache-control": "no-store", "access-control-allow-origin": "*" },')
          p.write_text(s)

          # API method for standalone build.
          p = Path('src/client/api.ts')
          s = p.read_text()
          anchor = '  addObject(projectId: string, name: string, folder = ""): Promise<LoadedProject> {'
          method = '''  buildProject(projectId: string): Promise<{ ok: true; projectId: string; output: string }> {
    return request<{ ok: true; projectId: string; output: string }>(`/api/projects/${encodeURIComponent(projectId)}/build`, {
      method: "POST", body: JSON.stringify({}),
    });
  },
'''
          if anchor not in s: raise RuntimeError('api build marker missing')
          s = s.replace(anchor, method + anchor, 1)
          p.write_text(s)

          # Studio iframe runner + bridge.
          p = Path('src/client/main.ts')
          s = p.read_text()
          anchor = 'const runButton = required<HTMLButtonElement>("#run");'
          s = s.replace(anchor, anchor + '\nconst buildButton = required<HTMLButtonElement>("#build-project");', 1)
          anchor = 'runButton.addEventListener("click", () => void runProject());'
          s = s.replace(anchor, anchor + '\nbuildButton.addEventListener("click", () => void buildProject());', 1)

          start = s.index('async function runProject(): Promise<void> {')
          end = s.index('\nfunction appendTrace(', start)
          new_run = r'''async function runProject(): Promise<void> {
  if (!project) return;
  if (dirty) {
    await saveSelectedObject();
    if (dirty) return;
  }

  runtime?.dispose();
  runtime = null;
  traceRows = [];
  liveBlackboard = null;
  renderTrace();
  renderBlackboard();

  const iframe = document.createElement("iframe");
  iframe.className = "app-preview-frame";
  iframe.title = `${project.manifest.name} preview`;
  iframe.sandbox.add("allow-scripts", "allow-forms", "allow-modals", "allow-popups");
  iframe.src = `/apps/${encodeURIComponent(project.manifest.id)}/?v=${Date.now()}`;
  previewHost.replaceChildren(iframe);
  previewPanel.classList.add("is-running");
  setGlobalStatus("Runtime starting in isolated iframe…");
}

async function buildProject(): Promise<void> {
  if (!project) return;
  if (dirty) {
    await saveSelectedObject();
    if (dirty) return;
  }
  try {
    buildButton.disabled = true;
    setGlobalStatus("Building standalone application…");
    const result = await api.buildProject(project.manifest.id);
    setGlobalStatus(`Standalone build ready: ${result.output}`);
  } catch (error) {
    setGlobalStatus(errorMessage(error), true);
  } finally {
    buildButton.disabled = false;
  }
}

'''
          s = s[:start] + new_run + s[end+1:]

          listener_anchor = 'setupNavigatorViews();'
          listener = r'''window.addEventListener("message", (event) => {
  const message = event.data as { source?: string; version?: number; type?: string; projectId?: string; trace?: RuntimeTrace; blackboard?: Record<string, BlackboardEntry>; message?: string };
  if (message?.source !== "spork-app" || message.version !== 1 || !project || message.projectId !== project.manifest.id) return;
  if (message.type === "trace" && message.trace) appendTrace(message.trace);
  else if (message.type === "blackboard" && message.blackboard) {
    liveBlackboard = message.blackboard;
    renderBlackboard();
  } else if (message.type === "ready") setGlobalStatus("Runtime running in isolated iframe");
  else if (message.type === "error") setGlobalStatus(message.message ?? "Application runtime error", true);
});

'''
          if listener_anchor not in s: raise RuntimeError('main setup marker missing')
          s = s.replace(listener_anchor, listener + listener_anchor, 1)
          p.write_text(s)

          # Build button.
          p = Path('src/client/index.html')
          s = p.read_text()
          anchor = '    <button id="run" class="toolbar-button run-button"><span class="play-icon">▶</span> Run</button>'
          replacement = '    <button id="build-project" class="toolbar-button">Build</button>\n' + anchor
          if anchor not in s: raise RuntimeError('run button marker missing')
          p.write_text(s.replace(anchor, replacement, 1))

          # Preview iframe styling.
          p = Path('src/client/styles.css')
          s = p.read_text() + '''\n.app-preview-frame { width: 100%; height: 100%; min-height: 320px; border: 0; background: #11141b; border-radius: 8px; }\n'''
          p.write_text(s)
          PY
      - name: Validate
        run: |
          deno task check
          deno task test
          deno task build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/client/runtime.ts scripts/build.ts src/server.ts src/client/api.ts src/client/main.ts src/client/index.html src/client/styles.css deno.lock
          git commit -m "feat(kernel): integrate iframe runtime and standalone build (#7)"
          git push origin HEAD:feature/app-runtime-kernel
