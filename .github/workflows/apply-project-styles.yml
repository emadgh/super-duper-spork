name: Apply project stylesheet integration

on:
  push:
    branches:
      - feature/project-style-pipeline
    paths:
      - ".github/workflows/apply-project-styles.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/project-style-pipeline
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Patch style integration
        run: |
          cat > /tmp/apply_styles.py <<'PY'
          from pathlib import Path

          def must_replace(text: str, old: str, new: str, label: str, count: int = 1) -> str:
              if old not in text:
                  raise RuntimeError(f"missing patch anchor: {label}")
              return text.replace(old, new, count)

          p = Path("src/server.ts")
          text = p.read_text()
          text = must_replace(
              text,
              'import ts from "npm:typescript@5.9.2";\n',
              'import ts from "npm:typescript@5.9.2";\nimport { defaultStyleCompiler } from "./server/style-pipeline.ts";\n',
              "style compiler import",
          )
          text = must_replace(
              text,
              '  objectFolders: string[];\n  instances: ProjectInstance[];',
              '  objectFolders: string[];\n  styles: string[];\n  instances: ProjectInstance[];',
              "manifest styles field",
          )

          object_route = '''    if (parts.length === 4 && parts[3] === "objects" && request.method === "POST") {
                const body = await readJson<{ name?: string; folder?: string }>(request);
                const name = body.name?.trim();
                if (!name) return json({ error: "Object name is required." }, 400);
                await addObject(projectId, name, body.folder ?? "");
                return json(await loadProject(projectId), 201);
              }
          '''
          # Normalize indentation from source before matching.
          object_route = "\n".join(line[6:] if line.startswith("      ") else line for line in object_route.splitlines()) + "\n"
          style_route = object_route + '''
              if (parts.length === 4 && parts[3] === "styles" && request.method === "POST") {
                const body = await readJson<{ name?: string }>(request);
                const name = body.name?.trim();
                if (!name) return json({ error: "Style name is required." }, 400);
                await addStyle(projectId, name);
                return json(await loadProject(projectId), 201);
              }
          '''
          style_route = object_route + "\n" + "\n".join(line[6:] if line.startswith("      ") else line for line in style_route[len(object_route):].splitlines()) + "\n"
          if object_route not in text:
              # Fall back to a stable insertion point.
              marker = '    if (parts.length === 4 && parts[3] === "folders" && request.method === "POST") {'
              block = '''    if (parts.length === 4 && parts[3] === "styles" && request.method === "POST") {
                const body = await readJson<{ name?: string }>(request);
                const name = body.name?.trim();
                if (!name) return json({ error: "Style name is required." }, 400);
                await addStyle(projectId, name);
                return json(await loadProject(projectId), 201);
              }

          '''
              block = "\n".join(line[6:] if line.startswith("      ") else line for line in block.splitlines())
              text = must_replace(text, marker, block + marker, "style POST route")
          else:
              text = text.replace(object_route, style_route, 1)

          reveal_marker = '    if (parts.length === 4 && parts[3] === "reveal" && request.method === "POST") {'
          save_style = '''    if (parts.length === 5 && parts[3] === "styles" && request.method === "PUT") {
            const file = validateStylePath(parts[4]);
            const body = await readJson<{ source?: string }>(request);
            if (typeof body.source !== "string") return json({ error: "Style source is required." }, 400);
            const manifest = await readManifest(projectId);
            if (!manifest.styles.includes(file)) return json({ error: "Unknown style file." }, 404);
            defaultStyleCompiler.compile(body.source, file);
            await Deno.writeTextFile(styleUrl(projectId, file), body.source);
            manifest.updatedAt = new Date().toISOString();
            await writeManifest(manifest);
            return json(await loadProject(projectId));
          }

          '''
          save_style = "\n".join(line[4:] if line.startswith("    ") else line for line in save_style.splitlines())
          text = must_replace(text, reveal_marker, save_style + reveal_marker, "style PUT route")

          # Every hard-coded v3 manifest receives an empty style list.
          text = text.replace('    objectFolders: [],\n    instances:', '    objectFolders: [],\n    styles: [],\n    instances:')

          template_fields = '''    objects: raw.objects.map(validateObjectPath),
            objectFolders: normalizeFolders(raw.objectFolders ?? [], raw.objects),
            instances: raw.instances.filter(isInstance).map(sanitizeProjectInstance),'''
          template_fields = "\n".join(line[4:] if line.startswith("    ") else line for line in template_fields.splitlines())
          template_fields_new = template_fields.replace(
              '    instances:',
              '    styles: Array.isArray(raw.styles) ? raw.styles.map(validateStylePath) : [],\n    instances:',
          )
          text = must_replace(text, template_fields, template_fields_new, "template manifest styles")

          template_copy_anchor = '  await Deno.mkdir(new URL("objects/", projectUrl(projectId)), { recursive: true });\n  for (const file of manifest.objects) {'
          text = must_replace(
              text,
              template_copy_anchor,
              '  await Deno.mkdir(new URL("objects/", projectUrl(projectId)), { recursive: true });\n  await Deno.mkdir(new URL("styles/", projectUrl(projectId)), { recursive: true });\n  for (const file of manifest.objects) {',
              "template styles directory",
          )
          template_end = '  }\n  await writeManifest(manifest);\n}\n\nasync function projectExists'
          style_copy = '''  }
            for (const file of manifest.styles) {
              const source = await Deno.readTextFile(new URL(`styles/${file}`, templateRoot));
              const compiled = defaultStyleCompiler.compile(source, file);
              if (compiled.warnings.length) console.warn(`Style ${file}: ${compiled.warnings.join("; ")}`);
              const target = styleUrl(projectId, file);
              await Deno.mkdir(new URL(".", target), { recursive: true });
              await Deno.writeTextFile(target, source);
            }
            await writeManifest(manifest);
          }

          async function projectExists'''
          style_copy = "\n".join(line[4:] if line.startswith("    ") else line for line in style_copy.splitlines())
          text = must_replace(text, template_end, style_copy, "template style copy")

          create_dir = '  await Deno.mkdir(new URL("objects/", dir), { recursive: true });\n\n  const manifest:'
          text = must_replace(
              text,
              create_dir,
              '  await Deno.mkdir(new URL("objects/", dir), { recursive: true });\n  await Deno.mkdir(new URL("styles/", dir), { recursive: true });\n\n  const manifest:',
              "new project styles directory",
          )

          folder_marker = 'async function addObjectFolder(projectId: string, rawName: string, rawParent = ""): Promise<void> {'
          add_style = '''async function addStyle(projectId: string, rawName: string): Promise<void> {
            const manifest = await readManifest(projectId);
            const base = slugify(rawName) || "styles";
            let file = validateStylePath(`${base}.css`);
            let index = 2;
            while (manifest.styles.includes(file)) file = validateStylePath(`${base}-${index++}.css`);
            const className = base.replace(/[^A-Za-z0-9_-]/g, "-");
            const source = `@layer project {\n  .${className} {\n    /* Project styles */\n  }\n}\n`;
            defaultStyleCompiler.compile(source, file);
            await Deno.mkdir(new URL("styles/", projectUrl(projectId)), { recursive: true });
            await Deno.writeTextFile(styleUrl(projectId, file), source);
            manifest.styles.push(file);
            manifest.updatedAt = new Date().toISOString();
            await writeManifest(manifest);
          }

          '''
          add_style = "\n".join(line[0:] for line in add_style.splitlines())
          text = must_replace(text, folder_marker, add_style + folder_marker, "addStyle function")

          old_load = '''async function loadProject(projectId: string): Promise<{
            manifest: ProjectManifest;
            objects: Array<{ file: string; source: string; compiled: string }>;
          }> {
            const manifest = await readManifest(projectId);
            const objects = [];
            for (const file of manifest.objects) {
              const source = await Deno.readTextFile(objectUrl(projectId, file));
              const result = transpileObject(source, file);
              objects.push({ file, source, compiled: result.output });
            }
            return { manifest, objects };
          }'''
          old_load = "\n".join(line[0:] if not line.startswith("          ") else line[10:] for line in old_load.splitlines())
          new_load = '''async function loadProject(projectId: string): Promise<{
            manifest: ProjectManifest;
            objects: Array<{ file: string; source: string; compiled: string }>;
            styles: Array<{ file: string; source: string; compiled: string; warnings: string[] }>;
          }> {
            const manifest = await readManifest(projectId);
            const objects = [];
            const styles = [];
            for (const file of manifest.objects) {
              const source = await Deno.readTextFile(objectUrl(projectId, file));
              const result = transpileObject(source, file);
              objects.push({ file, source, compiled: result.output });
            }
            for (const file of manifest.styles) {
              const source = await Deno.readTextFile(styleUrl(projectId, file));
              const result = defaultStyleCompiler.compile(source, file);
              styles.push({ file, source, compiled: result.css, warnings: result.warnings });
            }
            return { manifest, objects, styles };
          }'''
          new_load = "\n".join(line[0:] if not line.startswith("          ") else line[10:] for line in new_load.splitlines())
          text = must_replace(text, old_load, new_load, "loadProject styles")

          loaded_marker = '    objectFolders: normalizeFolders(explicitFolders, objects),\n    instances:'
          text = must_replace(
              text,
              loaded_marker,
              '    objectFolders: normalizeFolders(explicitFolders, objects),\n    styles: Array.isArray(manifest.styles) ? manifest.styles.filter((value): value is string => typeof value === "string").map(validateStylePath) : [],\n    instances:',
              "loaded manifest styles",
          )
          current_marker = '    objectFolders: normalizeFolders(current.objectFolders, current.objects),\n    instances: current.instances,'
          text = must_replace(
              text,
              current_marker,
              '    objectFolders: normalizeFolders(current.objectFolders, current.objects),\n    styles: current.styles,\n    instances: current.instances,',
              "saved manifest styles",
          )

          object_folder_url = 'function objectFolderUrl(projectId: string, folder: string): URL {'
          style_url = '''function styleUrl(projectId: string, file: string): URL {
            return new URL(`styles/${encodeObjectPath(validateStylePath(file))}`, projectUrl(projectId));
          }

          '''
          style_url = "\n".join(line[0:] for line in style_url.splitlines())
          text = must_replace(text, object_folder_url, style_url + object_folder_url, "styleUrl")

          validate_folder = 'function validateObjectFolder(value: string): string {'
          validate_style = r'''function validateStylePath(value: string): string {
            const normalized = value.replace(/\\/g, "/").replace(/^\/+|\/+$/g, "");
            const segments = normalized.split("/");
            if (!segments.length || segments.length > 8) throw new Error("Invalid style path.");
            const file = segments.at(-1) ?? "";
            if (!/^[A-Za-z0-9][A-Za-z0-9_.-]{0,79}\.css$/i.test(file)) throw new Error("Invalid style filename.");
            for (const folder of segments.slice(0, -1)) validateFolderSegment(folder);
            return segments.join("/");
          }

          '''
          validate_style = "\n".join(line[0:] for line in validate_style.splitlines())
          text = must_replace(text, validate_folder, validate_style + validate_folder, "validateStylePath")
          p.write_text(text)

          # Preview receives already-compiled project CSS. DomCore remains unaware of the compiler/provider.
          p = Path("src/client/runtime.ts")
          text = p.read_text()
          old = '''  mountPreview(root: HTMLElement): void {
            root.replaceChildren();
            const mounted = new Set<string>();'''
          old = "\n".join(line[0:] if not line.startswith("          ") else line[10:] for line in old.splitlines())
          new = '''  mountPreview(root: HTMLElement, options: { styles?: readonly string[] } = {}): void {
            root.replaceChildren();
            const appRoot = document.createElement("div");
            appRoot.className = "spork-app";
            if (options.styles?.length) {
              const style = document.createElement("style");
              style.dataset.sporkProjectStyles = "";
              style.textContent = options.styles.join("\\n");
              root.append(style);
            }
            root.append(appRoot);
            const mounted = new Set<string>();'''
          new = "\n".join(line[0:] if not line.startswith("          ") else line[10:] for line in new.splitlines())
          text = must_replace(text, old, new, "runtime style root")
          text = text.replace('mountInstance(instance, root, false);', 'mountInstance(instance, appRoot, false);')
          text = text.replace('mountInstance({ ...instance, parent: undefined }, root, false);', 'mountInstance({ ...instance, parent: undefined }, appRoot, false);')
          p.write_text(text)

          p = Path("src/client/main.ts")
          text = p.read_text()
          text = must_replace(
              text,
              '  runtime.mountPreview(previewHost);',
              '  runtime.mountPreview(previewHost, { styles: project.styles.map((style) => style.compiled) });',
              "main preview styles",
          )
          p.write_text(text)
          PY

      - name: Validate and record result
        run: |
          mkdir -p .ci
          set +e
          python3 /tmp/apply_styles.py > .ci/style-integration.txt 2>&1
          patch_status=$?
          echo "PATCH_STATUS=$patch_status" >> .ci/style-integration.txt
          if [ "$patch_status" -eq 0 ]; then
            deno task check >> .ci/style-integration.txt 2>&1
            echo "CHECK_STATUS=$?" >> .ci/style-integration.txt
            deno task test >> .ci/style-integration.txt 2>&1
            echo "TEST_STATUS=$?" >> .ci/style-integration.txt
            deno task build >> .ci/style-integration.txt 2>&1
            echo "BUILD_STATUS=$?" >> .ci/style-integration.txt
          fi
          cat .ci/style-integration.txt
          exit 0

      - name: Commit integration or diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.ts src/client/runtime.ts src/client/main.ts deno.lock .ci/style-integration.txt
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat(styles): integrate project CSS pipeline (#5)"
          git push origin HEAD:feature/project-style-pipeline
